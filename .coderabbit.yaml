language: en-US

reviews:
  profile: chill
  request_changes_workflow: true
  auto_review:
    enabled: false
  high_level_summary: true

  path_instructions:
    - path: '**/*'
      instructions: |
        This repository is a monorepo.

        General rules:
        - Keep changes scoped to the relevant workspace.
        - Avoid introducing dependencies between apps and packages unless required.
        - Public API changes require tests and documentation updates.
        - Prefer minimal, focused changes over broad refactors.
        - Flag breaking changes clearly.
        - Check that examples and documentation match the actual implementation.

    - path: 'packages/vern-llm/**'
      instructions: |
        This is the core VernLLM package.

        Review TypeScript changes with focus on:
        - Public API stability and backwards compatibility.
        - Correct TypeScript typing and avoiding unnecessary casts.
        - Proper handling of generic types.
        - Provider adapter consistency.
        - Retry, timeout, caching, and circuit breaker behavior.
        - Error classification and whether errors are retryable.
        - Avoiding provider-specific behavior leaking into the core layer.

        For new features:
        - Require unit tests.
        - Require integration tests when provider behavior changes.
        - Ensure changes are documented when public APIs change.

        Pay special attention to:
        - CallParams changes.
        - LLMClient interface changes.
        - Adapter transformations.
        - Response parsing and validation.
        - Breaking changes to exported types.

    - path: 'packages/vern-llm/src/adapters/**'
      instructions: |
        Review provider adapters carefully.

        Check:
        - Provider API conventions are followed.
        - Message roles are mapped correctly.
        - Provider-specific limitations are documented.
        - Native provider features are preferred over prompt-based workarounds.
        - Responses are normalized consistently into VernLLM behavior.

        Flag:
        - Silent fallbacks that hide provider incompatibilities.
        - Incorrect assumptions about model capabilities.
        - Missing tests for provider-specific behavior.

    - path: 'packages/vern-llm/tests/**'
      instructions: |
        Review tests for:
        - Meaningful assertions instead of implementation-only checks.
        - Coverage of success and failure cases.
        - Correct mocking of provider behavior.
        - Regression coverage for bug fixes.

    - path: 'packages/integrations/vern-llm-redis/**'
      instructions: |
        This is vern-llm-redis: Redis backed CircuitBreakerAdapter,
        RateLimiterAdapter, and CacheAdapter implementations for vern-llm.

        Review TypeScript changes with focus on:
        - Correctness of the adapter contract, assertClosed stays synchronous, acquire's waiting behavior, cache get/set/delete semantics.
        - Lua script correctness and atomicity.
        - Parity between the ioredis and node-redis client wrappers.
        - vern-llm is a peer dependency and is never bundled, so the app's own copy is used. Its `LLMError` export is used directly at runtime for every thrown error, never a look-alike class, since vern-llm's normalizeError() does an `instanceof LLMError` check. Purely structural types stay `import type` only.
        - assertClosed never optimistically guesses cooldown has elapsed; it only allows a call once Redis has confirmed this process holds the half-open trial. Flag anything that skips that confirmation.
        - Timing assertions use the shared helpers instead of a fresh fixed sleep.

        For new features:
        - Require unit tests (mocked Redis) and integration tests (real Redis).
        - Ensure changes are documented when public APIs change.

        Pay special attention to:
        - RedisClient/RedisSubscriber interface changes.
        - Adapter option changes.
        - Breaking changes to exported types.

    - path: 'packages/integrations/vern-llm-redis/tests/**'
      instructions: |
        Review tests for:
        - Meaningful assertions instead of implementation-only checks.
        - Unit tests never open a real Redis connection.
        - Integration tests use the shared helpers (waitUntil, expectNearInstant) instead of ad hoc sleeps.
        - Cross-process behavior (circuit breaker/rate limiter state propagation) uses two separate client connections, not one reused.

    - path: 'packages/integrations/vern-llm-otel/**'
      instructions: |
        This is vern-llm-otel: OpenTelemetry traces and metrics for vern-llm, built only on its public middleware system.

        Review TypeScript changes with focus on:
        - The middleware never changes what a call returns or throws. Every OpenTelemetry call and user callback goes through the guard, next()'s exact error is rethrown, and every span ends in a finally block even when a span write fails.
        - Streams are observed on the side only. Flag anything that replaces or wraps chunks or finalResult, or adds a promise that can reject.
        - Errors are recognised by shape, never with instanceof or isLLMError, since vern-llm's ESM and CJS builds have separate LLMError classes. The entry stays static with no enabled function, which would make event delivery async.
        - Privacy fails closed: content is off by default, redact runs before truncation, only error codes are recorded, and metric attributes stay bounded with no request ids or messages.
        - Names live only in semconv.ts, gen_ai.* must exist in the GenAI conventions, and vern-llm and @opentelemetry/api stay unbundled peer dependencies.
        - endAttributes is written before the package's own end attributes, so it can never replace one. otelLogFields reads ids from ctx.state, and the package never imports vern-llm-logger.

        For new features, require unit tests and integration tests against in memory exporters, keep coverage at 100 percent, and document public API changes.

        Pay special attention to renamed or removed spans, attributes, metrics, or options, since dashboards depend on them.

    - path: 'packages/integrations/vern-llm-otel/tests/**'
      instructions: |
        Review tests for:
        - Meaningful assertions, with no live provider or collector, only fakes and in memory exporters and readers.
        - Scenarios that compare each case with and without the middleware, and span leaks checked with the open span tracker in the shared helpers.
        - Timing assertions with a wide margin, and any global provider or context manager removed afterwards.

    - path: 'packages/extensions/vern-llm-logger/**'
      instructions: |
        This is vern-llm-logger: structured call logs, rolling latency percentiles, and slow call and error detection for vern-llm, built only on its public middleware system.

        Review TypeScript changes with focus on:
        - The middleware never changes what a call returns or throws. Every hook body, user callback and sink call goes through the guard, and next()'s exact error is rethrown.
        - Streams are observed on the side only. Flag anything that replaces or wraps chunks or finalResult, or adds a promise that can reject.
        - Never log prompt or response content or an error message, only error type, code and status.
        - The entry stays static with no enabled function, which would make event delivery async, and it never imports another extension. Anything it reads from one goes through ctx.state or custom events.
        - Options are validated once in normalizeOptions, an explicit null is reported rather than defaulted, and runtime code trusts the resolved config.
        - Stats and detectors stay pure, with no vern-llm imports, and every cache and series map has a size cap.
        - The per call path stays cheap: no merging of window slots per call (the slow check reads a cached percentile), and tests/bench/baseline.json is only updated deliberately, with the new numbers explained.

        For new features, require unit tests and integration tests with a real VernLLM and the memory sink, and document public API changes.

        Pay special attention to renamed or removed record fields, since log pipelines depend on them.

    - path: 'packages/extensions/vern-llm-logger/tests/**'
      instructions: |
        Review tests for:
        - Meaningful assertions, with no live provider, only fakes and the memory sink.
        - Scenarios that compare each case with and without the middleware.
        - Fake clocks instead of real sleeps for anything time based, and wide margins on any real timing assertion.

    - path: 'packages/extensions/vern-llm-usage/**'
      instructions: |
        This is vern-llm-usage: estimated cost, wasted spend and budgets for vern-llm calls, built only on its public middleware system.

        Review TypeScript changes with focus on:
        - The middleware never changes what a call returns or throws, except a budget rejection. Every hook body, user callback and store call goes through the guard, and next()'s exact error is rethrown. A rejection is an LLMError with type quota_exceeded and code budget_exceeded, thrown before any provider is contacted.
        - Money stays integer nano dollars internally and is converted to USD only at the public edge. Check rounding, clamping at zero and the safe integer range.
        - Reservations are all or none across scopes and always settled once: commit when usage was reported, release when none was, including on errors, aborts and streams.
        - Streams are observed on the side only. The call ends when finalResult settles, and nothing replaces chunks or finalResult or adds a promise that can reject. State the logger reads must be written before any await.
        - The entry stays static with no enabled function, which would make event delivery async, and it never imports another extension. The logger reads cost through ctx.state.
        - The estimate counts max_tokens once and prices the dearest allowed target. Unpriced targets are skipped, never guessed.
        - Options are validated once in normalizeOptions, an explicit null is reported rather than defaulted, and runtime code trusts the resolved config.
        - Every map has a size cap: store scopes, totals series and remembered warnings.
        - Budgets are guards, not ledgers. Docs and wording must not promise exact spend, and prices come only from the user's dated table.

        For new features, require unit tests and integration tests with a real VernLLM and fake clients, and document public API changes.

        Pay special attention to renamed fields in usageLogFields, totals and events, since dashboards and log pipelines depend on them.

    - path: 'packages/extensions/vern-llm-usage/tests/**'
      instructions: |
        Review tests for:
        - Meaningful assertions, with no live provider, only fakes and the memory store.
        - Scenarios against a real VernLLM, with the spy store used to prove what was reserved, settled and released.
        - Fake Date for anything calendar based, and no real sleeps beyond a tick.

    - path: 'packages/extensions/vern-llm-router/**'
      instructions: |
        This is vern-llm-router: it picks the target order for each vern-llm call, built only on the public middleware system.

        Review TypeScript changes with focus on:
        - The decision is pure and synchronous, with no I/O, timers or awaits before next(). Anything that can throw runs inside the guard, and a failure runs the call exactly as it would be without a router.
        - The router only reorders or drops targets by name through next({ targets }). It never adds a target, never changes what a call returns or throws, and never leaves an empty list: when nothing would remain, the declared order is kept.
        - A caller chosen order (ctx.callTargets) is pinned and left alone. Shadow mode (apply: false) computes and emits every decision and changes nothing.
        - The router.decision event carries names and numbers only, and is emitted after next() settles, also when it throws. applied is false for shadow, pinned and cache hits or joins.
        - Options are validated once in normalizeOptions and runtime code trusts the resolved config. Every map or set that grows with traffic has a size cap.
        - It stays static with no enabled function, never imports another extension, and keeps vern-llm an unbundled peer dependency.

        For new features, require unit tests and integration tests with a real VernLLM and fake clients, and document public API changes.

    - path: 'packages/extensions/vern-llm-router/tests/**'
      instructions: |
        Review tests for:
        - Meaningful assertions, with no live provider, only fakes.
        - Scenarios against a real VernLLM that assert which targets were tried and the decision event.
        - Fake clocks instead of real sleeps for anything time based.

    - path: 'packages/integrations/vern-llm-bedrock/**'
      instructions: |
        This is vern-llm-bedrock: the AWS Bedrock Converse adapter for vern-llm, built on the AWS SDK's BedrockRuntimeClient.

        Review TypeScript changes with focus on:
        - Requests and responses use the SDK's own types, never structural copies. Stream events are narrowed one member at a time, so the generated $unknown member and event kinds added later are skipped, not misrouted.
        - Claude rules (structured output planning, thinking, the forced tool_choice check) live in this package, since vern-llm/adapters exports only the from* factories. When one changes, check whether fromAnthropic in vern-llm needs the same change, so the two don't drift apart.
        - Every call path failure is an LLMError with the right type and code, including in-band stream exceptions, and local capability errors throw before dispatch so they are never retried or counted toward the breaker.
        - Converse quirks stay here: strict role alternation, tool results as user turns, the JSON string schema under outputConfig.textFormat, and no toolChoice equivalent to 'none'.
        - vern-llm and @aws-sdk/client-bedrock-runtime stay unbundled peer dependencies, ConverseCommand and ConverseStreamCommand are imported statically, and the adapter keeps naming itself aws.bedrock.

        For new features, require unit tests against a real BedrockRuntimeClient with a stubbed send, keep coverage at 100 percent, and document public API changes.

        Pay special attention to changed options, defaults, or error codes, since callers and fallback policies branch on them.

    - path: 'packages/integrations/vern-llm-bedrock/tests/**'
      instructions: |
        Review tests for:
        - Meaningful assertions, driving a real BedrockRuntimeClient with a stubbed send or the loopback server, never a live AWS endpoint.
        - Both create and createStream covered for request mapping changes, including in-band stream exceptions and unknown event kinds.
        - Shared helpers from tests/helpers.ts instead of new ad hoc fakes.

    - path: 'apps/docs/**'
      instructions: |
        This is the VernLLM documentation site using Fumadocs.

        Review documentation changes with focus on:
        - Valid MDX syntax.
        - Fumadocs compatibility.
        - Clear structure and navigation.
        - Accurate API examples.
        - Examples matching the current package API.

        Documentation should:
        - Explain user workflows in Guides.
        - Keep detailed signatures/types in API Reference.
        - Avoid documenting internal implementation details unless necessary.

        Flag:
        - Incorrect imports.
        - Outdated API usage.
        - Examples that would not compile.
        - Missing documentation for new public features.

    - path: 'apps/docs/content/**'
      instructions: |
        Review content organization:
        - Guides should explain how to use features.
        - API reference should describe exported APIs.
        - Adapter documentation should only cover provider-specific behavior.
        - Avoid duplicate documentation across sections.

    - path: '**/*'
      instructions: |
        Formatting is handled by oxfmt. Do not suggest manual formatting changes unless they affect correctness.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: local
