name: Version

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: version-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    # Only run when the Version Packages PR was actually merged.
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main'

    runs-on: ubuntu-latest

    outputs:
      tags: ${{ steps.detect.outputs.tags }}

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify there are no pending changesets
        run: pnpm changeset status

      # A Version Packages PR can bump more than one package's version in
      # the same merge (independent versioning means each package that
      # had a changeset gets its own bump, in one PR). This finds every
      # package.json whose version actually changed in that merge, one
      # release per package, not one release for the whole merge.
      - name: Detect released packages
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          TAGS_JSON="[]"

          for FILE in $(git diff --name-only "$BASE_SHA" HEAD -- '**/package.json'); do
            [ -f "$FILE" ] || continue

            IS_PRIVATE="$(jq -r '.private // false' "$FILE")"
            [ "$IS_PRIVATE" = "true" ] && continue

            NAME="$(jq -r '.name // empty' "$FILE")"
            NEW_VERSION="$(jq -r '.version // empty' "$FILE")"
            [ -z "$NAME" ] && continue
            [ -z "$NEW_VERSION" ] && continue

            OLD_VERSION="$(git show "$BASE_SHA:$FILE" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || echo '')"

            if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
              TAG="$NAME@$NEW_VERSION"
              TAGS_JSON="$(jq -c --arg t "$TAG" '. + [$t]' <<< "$TAGS_JSON")"
            fi
          done

          echo "Detected releases: $TAGS_JSON"
          echo "tags=$TAGS_JSON" >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.tags != '[]'
    runs-on: ubuntu-latest

    strategy:
      # One release per package, run independently: one package's tag,
      # release, and publish dispatch never blocks or depends on another's.
      matrix:
        tag: ${{ fromJson(needs.detect.outputs.tags) }}
      fail-fast: false

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          NAME="${TAG%@*}"
          VERSION="${TAG##*@}"
          export NAME
          echo "Tag: $TAG -> package: $NAME version: $VERSION"

          DIR="$(node -e '
            const fs = require("fs");
            const path = require("path");
            const name = process.env.NAME;
            for (const root of ["packages", "apps"]) {
              if (!fs.existsSync(root)) continue;
              for (const entry of fs.readdirSync(root)) {
                const pkgPath = path.join(root, entry, "package.json");
                if (!fs.existsSync(pkgPath)) continue;
                const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
                if (pkg.name === name) {
                  process.stdout.write(path.join(root, entry));
                  process.exit(0);
                }
              }
            }
          ')"

          if [ -z "$DIR" ]; then
            echo "ERROR: no workspace package named '$NAME' found"
            exit 1
          fi

          CHANGELOG="$DIR/CHANGELOG.md"
          NOTES_FILE="$RUNNER_TEMP/release-notes-$NAME.md"

          if [ -f "$CHANGELOG" ]; then
            awk -v ver="$VERSION" '$0 == "## " ver {p=1; print; next} /^## / && p {exit} p' "$CHANGELOG" > "$NOTES_FILE" || true
          else
            touch "$NOTES_FILE"
          fi

          if [ ! -s "$NOTES_FILE" ]; then
            echo "WARNING: no CHANGELOG excerpt found for $TAG, using fallback"
            echo "Release $TAG" > "$NOTES_FILE"
          fi

          head -n 5 "$NOTES_FILE"
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.tag }}
          target_commitish: main
          body_path: ${{ steps.notes.outputs.file }}

      - name: Trigger production publish
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
          TAG: ${{ matrix.tag }}
        run: |
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field mode=production \
            --field tag="$TAG"
