name: Version

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: version-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    # Only run when the Version Packages PR was actually merged.
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read package version
        id: pkg
        run: |
          VERSION="$(node -p "require('./packages/vern-llm/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=vern-llm@$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify there are no pending changesets
        run: |
          pnpm changeset status

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: ${{ steps.pkg.outputs.tag }}
          target_commitish: main
          generate_release_notes: true

      - name: Trigger production publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field mode=production \
            --field tag="$TAG"
