name: Changeset

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/vern-llm/**'
      - 'packages/integrations/**'
      - 'packages/extensions/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changeset:
    if: github.head_ref != 'changeset-release/main' && !startsWith(github.head_ref, 'renovate/') && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          nx-cache: 'false'
          nx-shas: 'false'

      - name: Check for changeset
        run: pnpm changeset status --since=origin/main
