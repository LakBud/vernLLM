name: Version Packages

on:
  push:
    branches: [main]
    # Only pushes that can change a release: package code, changesets, or the
    # root manifest and lockfile. Anything else (docs, workflows) never starts this run.
    paths:
      - 'packages/vern-llm/**'
      - 'packages/integrations/**'
      - 'packages/extensions/**'
      - '.changeset/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: version-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version-packages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The pnpm version comes from "packageManager" in the root package.json,
      # the same single source every other workflow uses.
      - uses: ./.github/actions/setup
        with:
          nx-cache: 'false'
          nx-shas: 'false'

      - name: Open or update the Version Packages PR
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run changeset:version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
