name: Version

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'packages/vern-llm/**'
              - '.changeset/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

      - if: steps.filter.outputs.code == 'true'
        uses: pnpm/action-setup@v4

      - if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.filter.outputs.code == 'true'
        name: Open or update the Version Packages PR
        uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.filter.outputs.code == 'true'
        name: Detect versioned release
        id: release
        run: |
          if git diff --quiet HEAD^ HEAD -- packages/vern-llm/package.json; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Fires only right after the Version Packages PR itself gets merged,
      # changesets/action reports no pending changesets in that case, which
      # means the version bump is already on main and ready to ship. The
      # package-version diff guard prevents ordinary main pushes from trying
      # to publish the already-published version again. Keep the release in
      # this workflow: GitHub does not start a second workflow for a release
      # created with GITHUB_TOKEN.
      - if: steps.filter.outputs.code == 'true' && steps.changesets.outputs.hasChangesets == 'false' && steps.release.outputs.ready == 'true'
        name: Read published version
        id: pkg
        run: echo "version=$(node -p "require('./packages/vern-llm/package.json').version")" >> "$GITHUB_OUTPUT"

      - if: steps.filter.outputs.code == 'true' && steps.changesets.outputs.hasChangesets == 'false' && steps.release.outputs.ready == 'true'
        name: Install release npm
        run: npm install -g npm@11.5.1 && npm --version

      - if: steps.filter.outputs.code == 'true' && steps.changesets.outputs.hasChangesets == 'false' && steps.release.outputs.ready == 'true'
        name: Verify release
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - if: steps.filter.outputs.code == 'true' && steps.changesets.outputs.hasChangesets == 'false' && steps.release.outputs.ready == 'true'
        name: Publish to npm
        run: pnpm changeset publish

      - if: steps.filter.outputs.code == 'true' && steps.changesets.outputs.hasChangesets == 'false' && steps.release.outputs.ready == 'true'
        name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vern-llm@${{ steps.pkg.outputs.version }}
          name: vern-llm@${{ steps.pkg.outputs.version }}
          generate_release_notes: true

      - if: steps.filter.outputs.code == 'true' && steps.changesets.outputs.hasChangesets == 'false' && steps.release.outputs.ready == 'true'
        name: Update docs changelog
        run: pnpm update-changelog

      - if: steps.filter.outputs.code == 'true' && steps.changesets.outputs.hasChangesets == 'false' && steps.release.outputs.ready == 'true'
        name: Commit changelog docs update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/content/docs/changelog.mdx
          git commit -m "docs: update changelog" || exit 0
          git push origin main

      - if: steps.filter.outputs.code == 'true' && steps.changesets.outputs.hasChangesets == 'false' && steps.release.outputs.ready == 'true'
        name: Deploy to Vercel
        run: curl -X POST "${{ secrets.VERNLLM_RELEASE }}"
