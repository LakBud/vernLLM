name: Publish

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.event.release.tag_name || github.run_id }}

permissions:
  contents: write
  id-token: write

jobs:
  # Manually-triggered canary publish, kept in this workflow file (rather than
  # its own) because npm's trusted publishing (OIDC) only trusts one workflow
  # file per package. A separate canary.yml would need its own trust
  # relationship configured on npmjs.com. The production release runs in
  # version.yml so it cannot be skipped by a GITHUB_TOKEN event limitation.
  canary:
    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11.5.1 && npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm --filter vern-llm run build

      - name: Set canary version
        working-directory: packages/vern-llm
        run: npm pkg set version="0.0.0-canary-${GITHUB_SHA::7}"

      - name: Publish canary to npm
        working-directory: packages/vern-llm
        run: npm publish --tag next

      - name: Summary
        run: echo "Published 0.0.0-canary-${GITHUB_SHA::7} to the next tag on npm" >> "$GITHUB_STEP_SUMMARY"
