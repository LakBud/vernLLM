name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Restores Nx's task cache (see nx.json's cacheDirectory) from the
      # most recent run of this job, so a task Nx already computed is
      # read back instead of re-run. Keyed per job, not shared across
      # jobs: two jobs saving an identical key would fail one of the
      # saves, since a GitHub Actions cache key can only be written once.
      # The key ends in the commit SHA so every run saves its own entry.
      # A key that only held the lockfile hash would match exactly on
      # every later run, and actions/cache skips the save on an exact
      # match, so the cache would stay frozen at the first run. Nx hashes
      # task inputs itself, so stale entries are never reused wrongly.
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.job }}-

      # Sets NX_BASE / NX_HEAD for this job, so `nx affected` below
      # compares against the PR's real base (or the last successful push
      # to main), not just the immediately preceding commit.
      - uses: nrwl/nx-set-shas@v5

      - name: Lint affected projects
        run: pnpm exec nx affected -t lint --verbose

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.job }}-

      - uses: nrwl/nx-set-shas@v5

      # vern-llm-redis type-checks against vern-llm's real built .d.ts
      # output via the workspace link, so its typecheck target depends
      # on vern-llm's build target (see nx.json). Nx runs that
      # automatically as part of the graph, no manual "build vern-llm
      # first" step needed here the way the old per-package workflows
      # required.
      - name: Typecheck affected projects
        run: pnpm exec nx affected -t typecheck typecheck:test types:check --verbose

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.job }}-

      - uses: nrwl/nx-set-shas@v5

      - name: Build, bundle-size check and smoke test affected projects
        run: pnpm exec nx affected -t build size smoke-test --verbose

      # bench:check exists on the core, the extensions and the integrations: it fails when a package's per call
      # cost grows past the baseline in tests/bench/baseline.json. One at a time, since a benchmark
      # that shares the runner with another task measures the other task as well.
      - name: Overhead check affected projects
        run: pnpm exec nx affected -t bench:check --parallel=1 --verbose

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.job }}-

      - uses: nrwl/nx-set-shas@v5

      - name: Test unit, affected projects
        run: pnpm exec nx affected -t test:unit:coverage --output-style=static --verbose

      # Each of these is a no-op (hashFiles empty, step skipped) unless
      # that specific project's test:unit:coverage actually ran above.
      - name: Upload vern-llm coverage to Codecov
        if: hashFiles('packages/vern-llm/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/vern-llm/coverage/lcov.info
          flags: unit
          fail_ci_if_error: true

      - name: Upload vern-llm-redis coverage to Codecov
        if: hashFiles('packages/integrations/vern-llm-redis/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/integrations/vern-llm-redis/coverage/lcov.info
          flags: vern-llm-redis-unit
          fail_ci_if_error: true

      - name: Upload vern-llm-otel coverage to Codecov
        if: hashFiles('packages/integrations/vern-llm-otel/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/integrations/vern-llm-otel/coverage/lcov.info
          flags: vern-llm-otel-unit
          fail_ci_if_error: true

      - name: Upload vern-llm-bedrock coverage to Codecov
        if: hashFiles('packages/integrations/vern-llm-bedrock/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/integrations/vern-llm-bedrock/coverage/lcov.info
          flags: vern-llm-bedrock-unit
          fail_ci_if_error: true

      - name: Upload vern-llm-logger coverage to Codecov
        if: hashFiles('packages/extensions/vern-llm-logger/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/extensions/vern-llm-logger/coverage/lcov.info
          flags: vern-llm-logger-unit
          fail_ci_if_error: true

      - name: Upload vern-llm-usage coverage to Codecov
        if: hashFiles('packages/extensions/vern-llm-usage/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/extensions/vern-llm-usage/coverage/lcov.info
          flags: vern-llm-usage-unit
          fail_ci_if_error: true

      - name: Upload vern-llm-router coverage to Codecov
        if: hashFiles('packages/extensions/vern-llm-router/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/extensions/vern-llm-router/coverage/lcov.info
          flags: vern-llm-router-unit
          fail_ci_if_error: true

      - name: Upload vern-llm-policy coverage to Codecov
        if: hashFiles('packages/extensions/vern-llm-policy/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/extensions/vern-llm-policy/coverage/lcov.info
          flags: vern-llm-policy-unit
          fail_ci_if_error: true
      - name: Upload vern-llm-guard coverage to Codecov
        if: hashFiles('packages/extensions/vern-llm-guard/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/extensions/vern-llm-guard/coverage/lcov.info
          flags: vern-llm-guard-unit
          fail_ci_if_error: true

  # No Nx cache here, deliberately: this job runs against a real Redis
  # service container. A cached "pass" from a previous run could hide a
  # real regression in how an adapter behaves against actual Redis state
  # (timing, pub/sub delivery, real eval() semantics), the one place a
  # stale-but-green result would be actively misleading rather than a
  # harmless skip.
  test-integration:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      # Only vern-llm-redis uses the redis-server binary, so the install below
      # is skipped when that project is not affected. This needs the
      # node_modules install and the NX_BASE / NX_HEAD values set above.
      - name: Check whether vern-llm-redis is affected
        id: redis-affected
        run: |
          if [ "$(pnpm exec nx show projects --affected --projects vern-llm-redis --json)" != "[]" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
          fi

      # The cluster tests (tests/integration/cluster.int.test.ts) run in this
      # job. tests/globalSetup.cluster.ts starts its own 3 node Redis Cluster
      # from the redis-server binary, so only the binary is needed here. With
      # CI set, a missing binary fails the run instead of skipping them.
      #
      # The service container above already owns port 6379, and installing
      # the package would start its own service on that port. A failed
      # start can fail the install, so services are blocked during it (the
      # policy-rc.d exit code 101 means "not allowed to start").
      - name: Install redis-server for the cluster tests
        if: steps.redis-affected.outputs.affected == 'true'
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          sudo rm -f /usr/sbin/policy-rc.d
          redis-server --version

      - name: Test integration, affected projects
        run: pnpm exec nx affected -t test:int:coverage --output-style=static --verbose

      - name: Upload vern-llm coverage to Codecov
        if: hashFiles('packages/vern-llm/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/vern-llm/coverage/lcov.info
          flags: integration
          fail_ci_if_error: true

      - name: Upload vern-llm-redis coverage to Codecov
        if: hashFiles('packages/integrations/vern-llm-redis/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/integrations/vern-llm-redis/coverage/lcov.info
          flags: vern-llm-redis-integration
          fail_ci_if_error: true

      - name: Upload vern-llm-otel coverage to Codecov
        if: hashFiles('packages/integrations/vern-llm-otel/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/integrations/vern-llm-otel/coverage/lcov.info
          flags: vern-llm-otel-integration
          fail_ci_if_error: true

      - name: Upload vern-llm-bedrock coverage to Codecov
        if: hashFiles('packages/integrations/vern-llm-bedrock/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/integrations/vern-llm-bedrock/coverage/lcov.info
          flags: vern-llm-bedrock-integration
          fail_ci_if_error: true

      - name: Upload vern-llm-logger coverage to Codecov
        if: hashFiles('packages/extensions/vern-llm-logger/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/extensions/vern-llm-logger/coverage/lcov.info
          flags: vern-llm-logger-integration
          fail_ci_if_error: true

      - name: Upload vern-llm-usage coverage to Codecov
        if: hashFiles('packages/extensions/vern-llm-usage/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/extensions/vern-llm-usage/coverage/lcov.info
          flags: vern-llm-usage-integration
          fail_ci_if_error: true

      - name: Upload vern-llm-router coverage to Codecov
        if: hashFiles('packages/extensions/vern-llm-router/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/extensions/vern-llm-router/coverage/lcov.info
          flags: vern-llm-router-integration
          fail_ci_if_error: true

      - name: Upload vern-llm-policy coverage to Codecov
        if: hashFiles('packages/extensions/vern-llm-policy/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/extensions/vern-llm-policy/coverage/lcov.info
          flags: vern-llm-policy-integration
          fail_ci_if_error: true
      - name: Upload vern-llm-guard coverage to Codecov
        if: hashFiles('packages/extensions/vern-llm-guard/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/extensions/vern-llm-guard/coverage/lcov.info
          flags: vern-llm-guard-integration
          fail_ci_if_error: true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.job }}-

      - uses: nrwl/nx-set-shas@v5

      # Explicit exclude, not a project filter Nx offers a cleaner flag
      # for: lint and build exist on every project, so an unscoped
      # `nx affected -t lint build` here would redundantly re-run them
      # for vern-llm and vern-llm-redis too (already covered by the lint
      # and build jobs above), not just for vern-llm-docs. Revisit with
      # Nx project tags (e.g. exclude '*,!tag:docs') if a fourth project
      # ever needs this same kind of scoping.
      #
      # Run as separate commands, not one combined target list:
      # types:check runs `next typegen`, which writes
      # apps/docs/.next/types/routes.d.ts, and build's `next build` can
      # clean or recreate .next. Combined in one Nx invocation these two
      # targets have no ordering guarantee within the same project and
      # can run concurrently, racing on that file.
      - name: Lint affected docs
        run: pnpm exec nx affected -t lint --exclude=vern-llm,vern-llm-redis,vern-llm-otel,vern-llm-bedrock,vern-llm-logger,vern-llm-usage,vern-llm-router,vern-llm-policy,vern-llm-guard --verbose

      - name: Typecheck affected docs
        run: pnpm exec nx affected -t types:check --exclude=vern-llm,vern-llm-redis,vern-llm-otel,vern-llm-bedrock,vern-llm-logger,vern-llm-usage,vern-llm-router,vern-llm-policy,vern-llm-guard --verbose

      # Fails on any internal /docs/... link whose page or #anchor doesn't
      # exist. The test target covers the checker itself.
      - name: Check affected docs links
        run: pnpm exec nx affected -t links:check test --exclude=vern-llm,vern-llm-redis,vern-llm-otel,vern-llm-bedrock,vern-llm-logger,vern-llm-usage,vern-llm-router,vern-llm-policy,vern-llm-guard --verbose

      # Next.js writes its incremental build cache to apps/docs/.next/cache,
      # which Nx does not track (the build target's outputs are dist). It is
      # restored here so `next build` reuses compiled output for unchanged
      # files. The source hash in the key makes each changed run save a new
      # entry, and restore-keys falls back to the latest entry for the same
      # lockfile.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/docs/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/src/**', 'apps/docs/content/**', 'apps/docs/*.ts', 'apps/docs/*.mjs', 'apps/docs/*.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Build affected docs
        run: pnpm exec nx affected -t build --exclude=vern-llm,vern-llm-redis,vern-llm-otel,vern-llm-bedrock,vern-llm-logger,vern-llm-usage,vern-llm-router,vern-llm-policy,vern-llm-guard --verbose
