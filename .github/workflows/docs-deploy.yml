name: Docs Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger docs deploy
        run: curl -f -X POST "$VERNLLM_RELEASE"
        env:
          VERNLLM_RELEASE: ${{ secrets.VERNLLM_RELEASE }}
