name: Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What should be published'
        required: true
        type: choice
        options:
          - production
          - canary

      tag:
        description: 'Production release tag, in <package-name>@<version> form, e.g. vern-llm@1.2.3 or vern-llm-redis@0.2.0'
        required: false
        type: string

      package:
        description: 'Canary only: workspace packages to publish (package.json names, comma or space separated). All get the same canary version, so include vern-llm when the others need unreleased core changes'
        required: false
        type: string
        default: vern-llm

concurrency:
  group: publish-${{ inputs.mode }}-${{ inputs.tag || inputs.package || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  production:
    if: inputs.mode == 'production'
    runs-on: ubuntu-latest

    steps:
      - name: Require a release tag in "<package-name>@<version>" form
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$TAG" ]]; then
            echo "ERROR: production publishing requires a release tag"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^.+@[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: invalid release tag: $TAG"
            exit 1
          fi

      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
          nx-cache: 'false'
          nx-shas: 'false'

      - run: npm install -g npm@11.5.1 && npm --version

      # Tags are "<package.json name>@<version>", split on the last "@"
      # so scoped names like "@org/name@1.2.3" still split correctly.
      - name: Resolve package name, version and directory from the tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          NAME="${TAG%@*}"
          VERSION="${TAG##*@}"
          DIR="$(node scripts/resolve-packages.ts "$NAME" | jq -r '.[0].dir')"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Verify the tag's version matches the package's own version
        env:
          DIR: ${{ steps.tag.outputs.dir }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          ACTUAL="$(jq -r '.version' "$DIR/package.json")"

          if [[ "$ACTUAL" != "$VERSION" ]]; then
            echo "ERROR: tag version '$VERSION' does not match $DIR/package.json version '$ACTUAL'"
            exit 1
          fi

      # Scoped to the package being released. Nx builds the workspace packages it
      # depends on first. The whole repo already passed CI on the merge that
      # produced this tag, so it is not run again here.
      - name: Typecheck and test the package
        env:
          NAME: ${{ steps.tag.outputs.name }}
        run: pnpm exec nx run-many -t typecheck typecheck:test types:check test:unit --projects="$NAME"

      - name: Build
        env:
          NAME: ${{ steps.tag.outputs.name }}
        run: pnpm --filter "$NAME" run build

      # Published from that package's own directory, scoped to only it,
      # not `changeset publish` at the repo root: two packages releasing
      # from the same Version Packages PR merge run this job in parallel
      # (see version.yml's matrix), and each run must only ever touch
      # its own package, never attempt the other's publish too.
      # pnpm publish, not npm publish: pnpm rewrites any workspace:
      # protocol dependency range (e.g. vern-llm-redis's dependency
      # on vern-llm) to a real semver range before publishing. npm
      # publish has no idea what "workspace:" means and would ship that
      # literal string, breaking install for every real consumer.
      # --no-git-checks since this runs against a detached tag checkout,
      # not a branch with a clean working tree pnpm would otherwise expect.
      - name: Publish to npm
        working-directory: ${{ steps.tag.outputs.dir }}
        run: pnpm publish --no-git-checks

      # Writes only this package's changelog page (update-changelog prints the
      # pages it wrote), so a release never overwrites another package's newer page.
      - name: Update docs changelog
        env:
          NAME: ${{ steps.tag.outputs.name }}
        run: pnpm --silent update-changelog "$NAME" > "$RUNNER_TEMP/changelog-pages.txt"

      - name: Commit changelog docs update
        run: |
          set -euo pipefail

          mapfile -t files < "$RUNNER_TEMP/changelog-pages.txt"

          # A package without a release yet has no generated page.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changelog pages to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main

          WORKTREE="$(mktemp -d)"
          git worktree add --detach "$WORKTREE" origin/main

          trap 'git worktree remove --force "$WORKTREE"' EXIT

          for file in "${files[@]}"; do
            mkdir -p "$WORKTREE/$(dirname "$file")"
            cp "$file" "$WORKTREE/$file"
          done

          cd "$WORKTREE"

          git add "${files[@]}"

          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
            exit 0
          fi

          git commit -m "docs: update changelog"

          # Packages released from the same merge run in parallel, each pushing
          # its own page, so a rejected push rebases and retries. A rebase that
          # leaves nothing new means another run already pushed it.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git diff --quiet origin/main HEAD; then
              echo "Changelog already up to date on main"
              exit 0
            fi
          done
          exit 1

      - name: Deploy to Vercel
        run: |
          curl -X POST "${{ secrets.VERNLLM_RELEASE }}"

  canary:
    if: inputs.mode == 'canary'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
          nx-cache: 'false'
          nx-shas: 'false'

      - run: npm install -g npm@11.5.1 && npm --version

      - run: pnpm run typecheck

      - run: pnpm run test:unit

      # Resolves every requested package to its directory. A package whose
      # workspace dependency is not in the same run gets a warning: its
      # published range points at the last real release, not this canary.
      - name: Resolve canary packages
        id: pkg
        env:
          NAMES: ${{ inputs.package || 'vern-llm' }}
        run: |
          set -euo pipefail
          RESOLVED="$(node scripts/resolve-packages.ts "$NAMES")"

          jq -r '
            map(.name) as $names
            | .[] | .name as $pkg | .workspaceDeps[]
            | select(. as $dep | $names | index($dep) | not)
            | "::warning::\($pkg) depends on \(.), which is not in this canary, so it will resolve to the last \(.) release"
          ' <<< "$RESOLVED"

          {
            echo "dirs=$(jq -r 'map(.dir) | join(" ")' <<< "$RESOLVED")"
            echo "filters=$(jq -r 'map("--filter=" + .name) | join(" ")' <<< "$RESOLVED")"
            echo "names=$(jq -r 'map(.name) | join(" ")' <<< "$RESOLVED")"
          } >> "$GITHUB_OUTPUT"

      - run: pnpm ${{ steps.pkg.outputs.filters }} run build

      # Every package gets the same version, so a workspace:^ range between
      # two of them is rewritten by pnpm publish to this exact canary.
      - name: Set canary version
        env:
          DIRS: ${{ steps.pkg.outputs.dirs }}
        run: |
          for DIR in $DIRS; do
            (cd "$DIR" && npm pkg set version="0.0.0-canary-${GITHUB_SHA::7}")
          done

      # pnpm publish, not npm publish: see the production job's comment
      # on the same substitution, same reasoning applies here too.
      - name: Publish canary to npm
        run: pnpm -r ${{ steps.pkg.outputs.filters }} publish --tag next --no-git-checks

      - name: Summary
        env:
          NAMES: ${{ steps.pkg.outputs.names }}
        run: |
          for NAME in $NAMES; do
            echo "Published $NAME@0.0.0-canary-${GITHUB_SHA::7} to the next tag on npm" >> "$GITHUB_STEP_SUMMARY"
          done
