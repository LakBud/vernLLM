name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.event.release.tag_name || github.run_id }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    # version.yml only creates a release once it has confirmed there are no
    # pending changesets left, i.e. the Version Packages PR was just merged.
    # Triggering on release publish (rather than the PR close event) means
    # this job can no longer run before that tag/release actually exists.
    if: >
      github.event_name == 'release' &&
      startsWith(github.event.release.tag_name, 'vern-llm@')

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11.5.1 && npm --version

      - run: pnpm install --frozen-lockfile

      - name: Read package version
        id: pkg
        run: |
          echo "version=$(node -p "require('./packages/vern-llm/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Sanity check release tag matches package version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          EXPECTED="vern-llm@${{ steps.pkg.outputs.version }}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Release tag $TAG does not match package.json version ($EXPECTED)"
            exit 1
          fi

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm run build

      - name: Publish to npm
        run: pnpm changeset publish

      - name: Update docs changelog
        run: pnpm update-changelog

      - name: Commit changelog docs update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add apps/docs/content/docs/changelog.mdx
          git commit -m "docs: update changelog" || exit 0
          git push origin main

      - name: Deploy to Vercel
        run: |
          curl -X POST "${{ secrets.VERNLLM_RELEASE }}"

  # Manually-triggered canary publish, kept in this workflow file (rather than
  # its own) because npm's trusted publishing (OIDC) only trusts one workflow
  # file per package. A separate canary.yml would need its own trust
  # relationship configured on npmjs.com; living here means canary publishes
  # share the same npm access as the real release job above.
  canary:
    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11.5.1 && npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm --filter vern-llm run build

      - name: Set canary version
        working-directory: packages/vern-llm
        run: npm pkg set version="0.0.0-canary-${GITHUB_SHA::7}"

      - name: Publish canary to npm
        working-directory: packages/vern-llm
        run: npm publish --tag next

      - name: Summary
        run: echo "Published 0.0.0-canary-${GITHUB_SHA::7} to the next tag on npm" >> "$GITHUB_STEP_SUMMARY"
