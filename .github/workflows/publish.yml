name: Publish

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.event.pull_request.merge_commit_sha || github.run_id }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11.5.1 && npm --version

      - run: pnpm install --frozen-lockfile

      - name: Read package version
        id: pkg
        run: |
          echo "version=$(node -p "require('./packages/vern-llm/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        run: |
          TAG="vern-llm@${{ steps.pkg.outputs.version }}"
          echo "Publishing $TAG"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "Tag $TAG exists"
          else
            echo "Tag $TAG does not exist"
            exit 1
          fi

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm run build

      - name: Publish to npm
        run: pnpm changeset publish

      - name: Update docs changelog
        run: pnpm update-changelog

      - name: Commit changelog docs update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add apps/docs/content/docs/changelog.mdx
          git commit -m "docs: update changelog" || exit 0
          git push origin main

      - name: Deploy to Vercel
        run: |
          curl -X POST "${{ secrets.VERNLLM_RELEASE }}"

  # Manually-triggered canary publish, kept in this workflow file (rather than
  # its own) because npm's trusted publishing (OIDC) only trusts one workflow
  # file per package. A separate canary.yml would need its own trust
  # relationship configured on npmjs.com; living here means canary publishes
  # share the same npm access as the real release job above.
  canary:
    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11.5.1 && npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm --filter vern-llm run build

      - name: Set canary version
        working-directory: packages/vern-llm
        run: npm pkg set version="0.0.0-canary-${GITHUB_SHA::7}"

      - name: Publish canary to npm
        working-directory: packages/vern-llm
        run: npm publish --tag next

      - name: Summary
        run: echo "Published 0.0.0-canary-${GITHUB_SHA::7} to the next tag on npm" >> "$GITHUB_STEP_SUMMARY"
