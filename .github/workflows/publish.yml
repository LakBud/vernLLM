name: Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What should be published'
        required: true
        type: choice
        options:
          - production
          - canary

      tag:
        description: 'Production release tag, e.g. vern-llm@1.2.3'
        required: false
        type: string

concurrency:
  group: publish-${{ inputs.mode }}-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  production:
    if: inputs.mode == 'production'
    runs-on: ubuntu-latest

    steps:
      - name: Require release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$TAG" ]]; then
            echo "ERROR: production publishing requires a release tag"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^vern-llm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: invalid release tag: $TAG"
            exit 1
          fi

      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@11.5.1 && npm --version

      - run: pnpm install --frozen-lockfile

      - name: Read package version
        id: pkg
        run: |
          VERSION="$(node -p "require('./packages/vern-llm/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          EXPECTED="vern-llm@$VERSION"

          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "ERROR: tag '$TAG' does not match package.json version '$VERSION'"
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        run: pnpm changeset publish

      - name: Update docs changelog
        run: pnpm update-changelog

      - name: Commit changelog docs update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main

          git add apps/docs/content/docs/changelog.mdx

          git commit -m "docs: update changelog" || exit 0
          git push origin main

      - name: Deploy to Vercel
        run: |
          curl -X POST "${{ secrets.VERNLLM_RELEASE }}"

  canary:
    if: inputs.mode == 'canary'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@11.5.1 && npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm --filter vern-llm run build

      - name: Set canary version
        working-directory: packages/vern-llm
        run: npm pkg set version="0.0.0-canary-${GITHUB_SHA::7}"

      - name: Publish canary to npm
        working-directory: packages/vern-llm
        run: npm publish --tag next

      - name: Summary
        run: |
          echo "Published 0.0.0-canary-${GITHUB_SHA::7} to the next tag on npm" \
            >> "$GITHUB_STEP_SUMMARY"
