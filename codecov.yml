flags:
  unit:
    paths:
      - 'packages/vern-llm/**'
  integration:
    paths:
      - 'packages/vern-llm/**'
  vern-llm-redis-unit:
    paths:
      - 'packages/integrations/vern-llm-redis/**'
  vern-llm-redis-integration:
    paths:
      - 'packages/integrations/vern-llm-redis/**'
  vern-llm-otel-unit:
    paths:
      - 'packages/integrations/vern-llm-otel/**'
  vern-llm-otel-integration:
    paths:
      - 'packages/integrations/vern-llm-otel/**'
  vern-llm-bedrock-unit:
    paths:
      - 'packages/integrations/vern-llm-bedrock/**'
  vern-llm-bedrock-integration:
    paths:
      - 'packages/integrations/vern-llm-bedrock/**'
  vern-llm-logger-unit:
    paths:
      - 'packages/extensions/vern-llm-logger/**'
  vern-llm-logger-integration:
    paths:
      - 'packages/extensions/vern-llm-logger/**'

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/vern-llm/**'
      vern-llm-redis:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/integrations/vern-llm-redis/**'
      vern-llm-otel:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/integrations/vern-llm-otel/**'
      vern-llm-bedrock:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/integrations/vern-llm-bedrock/**'
      vern-llm-logger:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/extensions/vern-llm-logger/**'
    patch:
      default:
        target: 80%
        paths:
          - 'packages/vern-llm/**'
      vern-llm-redis:
        target: 80%
        paths:
          - 'packages/integrations/vern-llm-redis/**'
      vern-llm-otel:
        target: 80%
        paths:
          - 'packages/integrations/vern-llm-otel/**'
      vern-llm-bedrock:
        target: 80%
        paths:
          - 'packages/integrations/vern-llm-bedrock/**'
      vern-llm-logger:
        target: 80%
        paths:
          - 'packages/extensions/vern-llm-logger/**'

ignore:
  - '**/index.ts'
  - 'apps/**'
