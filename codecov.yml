flags:
  unit:
    paths:
      - 'packages/vern-llm/**'
  integration:
    paths:
      - 'packages/vern-llm/**'
  vern-llm-redis-unit:
    paths:
      - 'packages/integrations/vern-llm-redis/**'
  vern-llm-redis-integration:
    paths:
      - 'packages/integrations/vern-llm-redis/**'
  vern-llm-otel-unit:
    paths:
      - 'packages/integrations/vern-llm-otel/**'
  vern-llm-otel-integration:
    paths:
      - 'packages/integrations/vern-llm-otel/**'
  vern-llm-bedrock-unit:
    paths:
      - 'packages/integrations/vern-llm-bedrock/**'
  vern-llm-bedrock-integration:
    paths:
      - 'packages/integrations/vern-llm-bedrock/**'
  vern-llm-logger-unit:
    paths:
      - 'packages/extensions/vern-llm-logger/**'
  vern-llm-logger-integration:
    paths:
      - 'packages/extensions/vern-llm-logger/**'
  vern-llm-usage-unit:
    paths:
      - 'packages/extensions/vern-llm-usage/**'
  vern-llm-usage-integration:
    paths:
      - 'packages/extensions/vern-llm-usage/**'
  vern-llm-router-unit:
    paths:
      - 'packages/extensions/vern-llm-router/**'
  vern-llm-router-integration:
    paths:
      - 'packages/extensions/vern-llm-router/**'
  vern-llm-policy-unit:
    paths:
      - 'packages/extensions/vern-llm-policy/**'
  vern-llm-policy-integration:
    paths:
      - 'packages/extensions/vern-llm-policy/**'
  vern-llm-guard-unit:
    paths:
      - 'packages/extensions/vern-llm-guard/**'
  vern-llm-guard-integration:
    paths:
      - 'packages/extensions/vern-llm-guard/**'
  vern-llm-hedge-unit:
    paths:
      - 'packages/extensions/vern-llm-hedge/**'
  vern-llm-hedge-integration:
    paths:
      - 'packages/extensions/vern-llm-hedge/**'

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/vern-llm/**'
      vern-llm-redis:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/integrations/vern-llm-redis/**'
      vern-llm-otel:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/integrations/vern-llm-otel/**'
      vern-llm-bedrock:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/integrations/vern-llm-bedrock/**'
      vern-llm-logger:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/extensions/vern-llm-logger/**'
      vern-llm-usage:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/extensions/vern-llm-usage/**'
      vern-llm-router:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/extensions/vern-llm-router/**'
      vern-llm-policy:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/extensions/vern-llm-policy/**'
      vern-llm-guard:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/extensions/vern-llm-guard/**'
      vern-llm-hedge:
        target: auto
        threshold: 0.5%
        paths:
          - 'packages/extensions/vern-llm-hedge/**'
    patch:
      default:
        target: 80%
        paths:
          - 'packages/vern-llm/**'
      vern-llm-redis:
        target: 80%
        paths:
          - 'packages/integrations/vern-llm-redis/**'
      vern-llm-otel:
        target: 80%
        paths:
          - 'packages/integrations/vern-llm-otel/**'
      vern-llm-bedrock:
        target: 80%
        paths:
          - 'packages/integrations/vern-llm-bedrock/**'
      vern-llm-logger:
        target: 80%
        paths:
          - 'packages/extensions/vern-llm-logger/**'
      vern-llm-usage:
        target: 80%
        paths:
          - 'packages/extensions/vern-llm-usage/**'
      vern-llm-router:
        target: 80%
        paths:
          - 'packages/extensions/vern-llm-router/**'
      vern-llm-policy:
        target: 80%
        paths:
          - 'packages/extensions/vern-llm-policy/**'
      vern-llm-guard:
        target: 80%
        paths:
          - 'packages/extensions/vern-llm-guard/**'
      vern-llm-hedge:
        target: 80%
        paths:
          - 'packages/extensions/vern-llm-hedge/**'

ignore:
  - '**/index.ts'
  - 'apps/**'
