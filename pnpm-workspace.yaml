packages:
  - packages/*
  - packages/integrations/*
  - packages/extensions/*
  - apps/*

allowBuilds:
  '@google/genai': true
  esbuild: true
  nx: false
  protobufjs: true
  rolldown: true
  sharp: false
  workerd: false

ignoredBuiltDependencies:
  - protobufjs
  - workerd

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - '@google/genai'
  - esbuild
  - nx

overrides:
  '@hono/node-server': ^2.1.8
  ahooks: ^3.11.0
  brace-expansion: ^5.0.13
  browserslist: ^4.29.5
  decode-uri-component: ^0.5.1
  diff: ^9.0.0
  dompurify: ^3.4.17
  fast-uri: ^4.2.3
  glob: ^13.0.7
  hono: ^4.13.18
  ip-address: ^10.7.6
  js-yaml: ^5.5.0
  mermaid: ^11.17.2
  nanoid: ^6.0.2
  next: ^16.4.6
  postcss: ^8.5.32
  qs: ^6.17.1
  read-yaml-file>js-yaml: ^5.5.0
  sharp: ^0.35.5
  undici: ^8.12.4
  valibot: ^1.5.0

peerDependencyRules:
  allowedVersions:
    '@emoji-mart/react>react': '19'
