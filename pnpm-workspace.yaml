packages:
  - packages/*
  - 'apps/*'

allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  rolldown: true
  sharp: false
  workerd: false

minimumReleaseAge: 1440

overrides:
  glob: ^13.0.6
  valibot: ^1.4.2
  sharp: ^0.35.4
  next: ^16.3.3
  postcss: ^8.5.26
  brace-expansion: ^5.0.9
  undici: ^8.10.0
  fast-uri: ^3.1.6
  ip-address: ^10.7.0
  nanoid: ^3.3.18
  hono: ^4.13.5
  '@hono/node-server': ^1.19.17
  mermaid: ^11.17.2
  dompurify: ^3.4.14
  diff: ^8.0.4
  js-yaml: ^4.3.2
  read-yaml-file>js-yaml: ^3.15.2

peerDependencyRules:
  allowedVersions:
    # @emoji-mart/react@1.1.1 (pulled in transitively by fumadocs-ui, no
    # newer release exists) declares a React 16-18 peer range but works
    # fine under React 19 in practice; this only silences the false-alarm
    # peer warning, it doesn't change what's installed.
    '@emoji-mart/react>react': '19'
