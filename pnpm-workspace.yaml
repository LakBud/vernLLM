packages:
  - packages/*
  - packages/integrations/*
  - packages/extensions/*
  - apps/*

allowBuilds:
  '@google/genai': true
  esbuild: true
  nx: false
  protobufjs: true
  rolldown: true
  sharp: false
  workerd: false

ignoredBuiltDependencies:
  - protobufjs
  - workerd

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - '@google/genai'
  - esbuild
  - nx

overrides:
  '@hono/node-server': ^2.1.5
  ahooks: ^3.10.0
  brace-expansion: ^5.0.12
  browserslist: ^4.29.4
  decode-uri-component: ^0.5.0
  diff: ^9.0.0
  dompurify: ^3.4.17
  fast-uri: ^4.2.3
  glob: ^13.0.6
  hono: ^4.13.13
  ip-address: ^10.7.4
  js-yaml: ^5.5.0
  mermaid: ^11.17.2
  nanoid: ^6.0.2
  next: ^16.4.2
  postcss: ^8.5.31
  qs: ^6.16.1
  read-yaml-file>js-yaml: ^5.5.0
  sharp: ^0.35.5
  undici: ^8.12.3
  valibot: ^1.5.0

peerDependencyRules:
  allowedVersions:
    '@emoji-mart/react>react': '19'
