packages:
  - packages/*
  - 'apps/*'

allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  rolldown: true
  sharp: false
  workerd: false

minimumReleaseAge: 1440

overrides:
  glob: ^13.0.6
  valibot: ^1.4.2
  sharp: ^0.35.0
  next: ^16.2.11
  postcss: ^8.5.23
  brace-expansion: ^5.0.9
  undici: ^7.29.0
  fast-uri: ^3.1.5
  ip-address: ^10.3.1
  nanoid: ^3.3.18
  hono: ^4.12.34
  '@hono/node-server': ^1.19.17
  mermaid: ^11.16.1
  dompurify: ^3.4.13
  diff: ^8.0.3
  js-yaml: ^4.3.1
  read-yaml-file>js-yaml: ^3.15.2

peerDependencyRules:
  allowedVersions:
    # @emoji-mart/react@1.1.1 (pulled in transitively by fumadocs-ui, no
    # newer release exists) declares a React 16-18 peer range but works
    # fine under React 19 in practice; this only silences the false-alarm
    # peer warning, it doesn't change what's installed.
    '@emoji-mart/react>react': '19'
