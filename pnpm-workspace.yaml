  dompurify: ^3.4.16
  fast-uri: ^4.2.1
  glob: ^13.0.6
  hono: ^4.13.13
  ip-address: ^10.7.3
  js-yaml: ^5.4.3
  mermaid: ^11.17.2
  nanoid: ^6.0.2
  next: ^16.4.0
  postcss: ^8.5.29
